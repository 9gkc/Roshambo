<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An accessible Rock Paper Scissors game with robust state handling, local statistics, and responsive controls." />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Rock Paper Scissors Game" />
    <meta property="og:description" content="An accessible Rock Paper Scissors game with robust state handling, local statistics, and responsive controls." />
    <meta name="twitter:card" content="summary" />

    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <main>
      <h1>Rock Paper Scissors</h1>
      <div class="container">
        <section class="upper-bar" aria-labelledby="choose-heading">
          <div>
            <h2 id="choose-heading">Choose your move</h2>
            <div class="buttons">
              <button type="button" data-choice="rock">
                <img src="images/rock.png" alt="" aria-hidden="true" />
                Rock
              </button>
              <button type="button" data-choice="paper">
                <img src="images/paper.png" alt="" aria-hidden="true" />
                Paper
              </button>
              <button type="button" data-choice="scissors">
                <img src="images/scissors.png" alt="" aria-hidden="true" />
                Scissors
              </button>
            </div>
          </div>
          <p id="result" class="result" role="status" aria-live="polite">Choose rock, paper, or scissors.</p>
        </section>
        <p id="game-status" class="game-status" role="status" aria-live="polite">Ready</p>
        <div class="game-container">
          <div class="choice-container">
            <h2>You</h2>
            <img id="player-choice" src="images/choose.png" alt="Your choice" />
          </div>
          <div class="versus" aria-hidden="true">Versus</div>
          <div class="choice-container">
            <h2>Computer</h2>
            <img id="computer-choice" src="images/random.png" alt="Computer choice" />
          </div>
        </div>
        <section id="match-history" aria-label="Match history"></section>
        <div id="reset-container"></div>
      </div>
    </main>
    <script src="main.js"></script>
  </body>
</html>
